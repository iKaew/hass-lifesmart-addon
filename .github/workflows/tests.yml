name: Unit tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home-assistant: [minimum, pinned]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            hacs.json

      - name: Install dependencies
        env:
          HA_TEST_VERSION: ${{ matrix.home-assistant }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          requirements = Path("requirements.txt").read_text()
          if os.environ["HA_TEST_VERSION"] == "minimum":
              minimum = json.loads(Path("hacs.json").read_text())["homeassistant"]
              requirements, count = re.subn(
                  r"^homeassistant==[^\n]+$",
                  f"homeassistant=={minimum}",
                  requirements,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit("Expected exactly one Home Assistant version pin")
          Path(os.environ["RUNNER_TEMP"], "requirements-test.txt").write_text(requirements)
          PY
          python -m pip install -r "$RUNNER_TEMP/requirements-test.txt"

      - name: Run Ruff
        run: python -m ruff check . --config .ruff.toml

      - name: Run unit tests
        run: pytest --cov --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ha-${{ matrix.home-assistant }}
