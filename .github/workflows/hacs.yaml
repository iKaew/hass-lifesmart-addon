name: Validate for HACS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v3"
      - uses: "actions/setup-python@v4"
        with:
          python-version: '3.13'
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
