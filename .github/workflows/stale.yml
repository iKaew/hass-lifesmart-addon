name: Close stale issues

on:
  schedule:
    # Run once a day at 01:30 UTC
    - cron: "30 1 * * *"

  # Allow manual execution from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v10
        with:
          # Mark issues as stale after 60 days without activity
          days-before-issue-stale: 60

          # Close 14 days after being marked stale
          days-before-issue-close: 14

          # Don't process pull requests
          days-before-pr-stale: -1
          days-before-pr-close: -1

          stale-issue-label: stale

          stale-issue-message: |
            I'm cleaning up older issues and have marked this one as stale due to inactivity.

            If the issue is still reproducible or relevant, please leave a comment with any updated details and I'll keep it open. If there's no further activity, I'll close it for now. It can always be revisited if the issue comes up again.

          close-issue-message: |
            Closing this due to inactivity.

            If this is still an issue, feel free to leave a comment with updated details or open a new issue referencing this one.

            Thanks!

          # GitHub close reason: "Not planned"
          close-issue-reason: not_planned

          # Never automatically stale important issues
          exempt-issue-labels: |
            pinned,
            security,
            never-stale
